[project]
name = "resolve-prep"
version = "0.1.0"
description = "Transcode camera clips to DNxHR so DaVinci Resolve on Linux can import them"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = [
    "tomli-w>=1.0",
]

[project.urls]
Homepage = "https://github.com/ryyyyan-taylor/resolve-prep"
Source = "https://github.com/ryyyyan-taylor/resolve-prep"

[project.optional-dependencies]
ui = ["PySide6>=6.7"]

[project.scripts]
resolve-prep = "resolveprep.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resolveprep"]

[tool.hatch.build.targets.wheel.shared-data]
"packaging/resolve-prep.desktop" = "share/applications/resolve-prep.desktop"
"packaging/resolve-prep.svg" = "share/icons/hicolor/scalable/apps/resolve-prep.svg"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "packaging", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
